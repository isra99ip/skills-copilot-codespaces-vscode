services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: betintel
      POSTGRES_PASSWORD: betintel
      POSTGRES_DB: betintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: