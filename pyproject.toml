[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betintel-ai"
version = "0.1.0"
description = "MVP tecnico para BetIntel AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.32,<1",
]
dashboard = [
  "streamlit>=1.40,<2",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"